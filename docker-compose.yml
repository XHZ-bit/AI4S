services:
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set}
    ports: ["127.0.0.1:17474:7474", "127.0.0.1:7687:7687"]
    volumes: ["neo4j_data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  grobid:
    image: lfoppiano/grobid:0.8.0
    ports: ["127.0.0.1:8070:8070"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8070'"]
      interval: 10s
      retries: 30
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      args:
        HTTP_PROXY: ${ATLAS_HTTP_PROXY:-}
        HTTPS_PROXY: ${ATLAS_HTTPS_PROXY:-}
        NO_PROXY: localhost,127.0.0.1,host.docker.internal
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      GROBID_BASE_URL: http://grobid:8070
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      RESEARCH_MODEL_ENABLED: ${RESEARCH_MODEL_ENABLED:-false}
      RESEARCH_MODEL_RESPONSE_FORMAT: ${RESEARCH_MODEL_RESPONSE_FORMAT:-json_object}
      RESEARCH_MODEL_TIMEOUT_SECONDS: ${RESEARCH_MODEL_TIMEOUT_SECONDS:-60}
      RESEARCH_MODEL_MAX_OUTPUT_TOKENS: ${RESEARCH_MODEL_MAX_OUTPUT_TOKENS:-2048}
      RESEARCH_MODEL_MAX_INPUT_CHARS: ${RESEARCH_MODEL_MAX_INPUT_CHARS:-60000}
      RESEARCH_MODEL_MAX_REQUESTS: ${RESEARCH_MODEL_MAX_REQUESTS:-16}
      HTTP_PROXY: ${ATLAS_HTTP_PROXY:-}
      HTTPS_PROXY: ${ATLAS_HTTPS_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,backend,neo4j,grobid,host.docker.internal
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["backend_data:/app/data"]
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        HTTP_PROXY: ${ATLAS_HTTP_PROXY:-}
        HTTPS_PROXY: ${ATLAS_HTTPS_PROXY:-}
        NO_PROXY: localhost,127.0.0.1,host.docker.internal
    ports: ["127.0.0.1:5173:80"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  neo4j_data:
  backend_data:
