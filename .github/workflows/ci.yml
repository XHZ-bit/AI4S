name: Offline quality and interaction
on: [push, pull_request]
jobs:
  quality:
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.1'
          # uv supplies the pinned interpreter on both Windows and Linux.
          python-version: '3.11.17'
          activate-environment: true
          venv-path: backend/.venv
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv lock --project backend --check
      - run: uv sync --project backend --locked --extra dev --python 3.11.17
      - name: Select the locked backend environment for scripts and browsers
        shell: python
        run: |
          import os
          from pathlib import Path
          folder = Path(os.environ['GITHUB_WORKSPACE']) / 'backend' / '.venv'
          binaries = folder / ('Scripts' if os.name == 'nt' else 'bin')
          executable = binaries / ('python.exe' if os.name == 'nt' else 'python')
          with open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8') as output:
              output.write(str(binaries) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('ATLAS_PYTHON=' + str(executable) + '\n')
      - run: python -m ruff check backend/app backend/scripts backend/tests evaluation/research_atlas evaluation/retrieval
      - run: python backend/scripts/test.py -q
      - run: python evaluation/research_atlas/evaluate_next_phase.py --output .ui_validation/next-phase-evaluation.json
      - run: python evaluation/research_atlas/benchmark_local_search.py --output .ui_validation/local-search-benchmark.json
      - run: python evaluation/research_atlas/benchmark_workflow_projection.py --output .ui_validation/workflow-projection-benchmark.json
      - run: python evaluation/retrieval/evaluate_retrieval.py --output .ui_validation/retrieval-fts.json
      - run: python evaluation/retrieval/evaluate_retrieval.py --scan --output .ui_validation/retrieval-scan.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: node evaluation/research_atlas/run_knowledge_browser.cjs .ui_validation/ci-knowledge
        env:
          ATLAS_PLAYWRIGHT_PATH: ${{ github.workspace }}/frontend/node_modules/playwright
      - run: node evaluation/research_atlas/run_auth_browser.cjs .ui_validation/ci-auth
        env:
          ATLAS_PLAYWRIGHT_PATH: ${{ github.workspace }}/frontend/node_modules/playwright
      - run: docker compose -f docker-compose.multiuser.yml config --quiet
        if: runner.os == 'Linux'
      - run: powershell -ExecutionPolicy Bypass -File evaluation/research_atlas/check_local_runtime.ps1 -OutputDir .ui_validation/ci-runtime
        if: runner.os == 'Windows'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interaction-${{ matrix.os }}
          path: |
            .ui_validation/ci-knowledge/*.png
            .ui_validation/ci-knowledge/report.json
            .ui_validation/ci-knowledge/servers.log
            .ui_validation/next-phase-evaluation.json
            .ui_validation/local-search-benchmark.json
            .ui_validation/workflow-projection-benchmark.json
            .ui_validation/retrieval-fts.json
            .ui_validation/retrieval-scan.json
            .ui_validation/ci-auth/*.png
            .ui_validation/ci-auth/report.json
            .ui_validation/ci-auth/servers.log
            .ui_validation/ci-runtime/runtime-check.json
